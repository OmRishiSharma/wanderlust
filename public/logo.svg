<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 42" width="200" height="42">
  <defs>
    <linearGradient id="wl-pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A63"/>
      <stop offset="100%" stop-color="#FE424D"/>
    </linearGradient>
    <linearGradient id="wl-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1B1A"/>
      <stop offset="88%" stop-color="#1C1B1A"/>
      <stop offset="100%" stop-color="#FE424D"/>
    </linearGradient>
    <filter id="wl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FE424D" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Brand Mark (Map Pin + Wanderlust 'W' Monogram + Rising Sun) -->
  <g transform="translate(2, 3)" filter="url(#wl-shadow)">
    <path d="M 18,2 C 10.27,2 4,8.27 4,16 C 4,24.2 13.8,32 17.1,34.2 C 17.65,34.6 18.35,34.6 18.9,34.2 C 22.2,32 32,24.2 32,16 C 32,8.27 25.73,2 18,2 Z" fill="url(#wl-pin-grad)"/>
    <circle cx="18" cy="10.5" r="2.2" fill="#FFFFFF"/>
    <path d="M 10.5,17.5 L 13.5,22.2 L 18,15.6 L 22.5,22.2 L 25.5,17.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark "Wanderlust" in Website Display Typeface -->
  <text x="46" y="27" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" letter-spacing="-0.02em" fill="url(#wl-text-grad)">Wanderlust</text>
  <!-- Accent Dot -->
  <circle cx="178" cy="14" r="2.5" fill="#FE424D"/>
</svg>
