# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wanderlust
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGO_URL
        sync: false # paste your MongoDB Atlas connection string in the dashboard
      - key: BASE_URL
        sync: false # e.g. https://wanderlust.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
